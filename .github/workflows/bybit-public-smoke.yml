name: Bybit public host real-network smoke
on:
  pull_request:
    paths:
      - "research/bybit-public-host/**"
      - ".github/workflows/bybit-public-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install public WebSocket client
        run: python -m pip install "websockets>=14,<17"
      - name: Run real public HTTP and WS checks; preserve exact bodies
        run: python research/bybit-public-host/gh-smoke.py
      - name: Upload evidence even on network failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bybit-public-http-ws-evidence
          path: evidence/
          retention-days: 7
          if-no-files-found: warn
